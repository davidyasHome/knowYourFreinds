<script>
"use strict";
/* ============================ כלים קטנים ============================ */
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ALPHA = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => ALPHA[b % ALPHA.length]).join("");
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
const QS = new URLSearchParams(location.search);
const BROKER = QS.get("broker") || CONFIG.broker;
const LETTERS = ["א","ב","ג","ד","ה","ו"];
const fmt = n => Number(n || 0).toLocaleString("he-IL");
const joinUrl = code => location.origin + location.pathname + location.search + "#" + code;

/* ============================ תקשורת מוצפנת ============================ */
const te = new TextEncoder(), td = new TextDecoder();
async function deriveRoom(code){
  const h = async s => new Uint8Array(await crypto.subtle.digest("SHA-256", te.encode(s)));
  const t = await h("topic:" + code), k = await h("key:" + code);
  return {
    base: CONFIG.topicPrefix + "/" + Array.from(t.slice(0, 12), b => b.toString(16).padStart(2, "0")).join(""),
    key: await crypto.subtle.importKey("raw", k, "AES-GCM", false, ["encrypt", "decrypt"]),
  };
}
async function seal(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj))));
  const all = new Uint8Array(12 + ct.length); all.set(iv); all.set(ct, 12);
  let s = ""; for (let i = 0; i < all.length; i += 8192) s += String.fromCharCode.apply(null, all.subarray(i, i + 8192));
  return btoa(s);
}
async function unseal(key, b64){
  const all = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.subarray(0, 12) }, key, all.subarray(12));
  return JSON.parse(td.decode(pt));
}
/** ערוץ משחק: listen = הערוץ שמאזינים לו ("up" למנהל, "state" לשחקנים). */
async function openNet(code, listen, onMsg, onStatus){
  if (!crypto.subtle) throw new Error("הדפדפן חוסם הצפנה בכתובת הזאת. פתחו את המשחק דרך https.");
  const room = await deriveRoom(code);
  const client = mqtt.connect(BROKER, { clientId: "mhs_" + rand(10), clean: true, keepalive: 30, reconnectPeriod: 1500, connectTimeout: 9000 });
  let on = false;
  client.on("connect", () => { on = true; client.subscribe(room.base + "/" + listen, { qos: 1 }); onStatus(true); });
  for (const ev of ["close", "offline", "error"]) client.on(ev, () => { if (on) { on = false; onStatus(false); } });
  client.on("message", (_t, payload) => { unseal(room.key, payload.toString()).then(onMsg).catch(() => {}); });
  return {
    get on(){ return on; },
    async send(chan, obj){ if (on) client.publish(room.base + "/" + chan, await seal(room.key, obj), { qos: 1 }); },
    close(){ client.end(true); },
  };
}

/* ============================ פענוח ייצוא וואטסאפ ============================ */
const RE_LINE = /^\[?(\d{1,2}[./-]\d{1,2}[./-]\d{2,4}),?\s+(\d{1,2}:\d{2})(?::\d{2})?(?:\s?[APap]\.?[Mm]\.?)?\]?(?:\s-)?\s(.*)$/;
const RE_MEDIA = /(המדיה לא נכללה|media omitted|<attached:|<מצורף:|הושמט|omitted$|\.(jpg|webp|opus|mp4|pdf) \(הקובץ מצורף\)|\(file attached\))/i;
const RE_SKIP = /(הודעה זו נמחקה|מחקת את ההודעה|this message was deleted|you deleted this message|^null$|ההודעות והשיחות מוצפנות|end-to-end encrypted)/i;
function parseChat(raw){
  const lines = raw.replace(/[‎‏‪-‮⁦-⁩﻿]/g, "").split(/\r?\n/);
  const msgs = []; let cur = null;
  for (const line of lines){
    const m = RE_LINE.exec(line);
    if (m){
      const i = m[3].indexOf(": ");
      if (i > 0 && i <= 60){ cur = { d: m[1], t: m[2], n: m[3].slice(0, i).trim(), x: m[3].slice(i + 2) }; msgs.push(cur); }
      else cur = null;                       // הודעת מערכת
    } else if (cur && line.trim()) cur.x += "\n" + line;
  }
  const stats = {}; const out = [];
  const st = n => stats[n] ||= { msgs: 0, media: 0, chars: 0, night: 0, emoji: {} };
  for (const m of msgs){
    const s = st(m.n);
    if (RE_MEDIA.test(m.x)){ s.media++; continue; }
    if (RE_SKIP.test(m.x) || !m.x.trim()) continue;
    s.msgs++; s.chars += m.x.length;
    const hr = parseInt(m.t, 10); if (hr < 5) s.night++;
    for (const e of m.x.match(/\p{Extended_Pictographic}/gu) || []) s.emoji[e] = (s.emoji[e] || 0) + 1;
    out.push(m);
  }
  return { msgs: out, stats, from: out[0]?.d, to: out.at(-1)?.d };
}
async function readChatFile(file){
  if (/\.zip$/i.test(file.name)){
    const zip = await JSZip.loadAsync(file);
    const txt = Object.values(zip.files).filter(f => /\.txt$/i.test(f.name)).sort((a, b) => b._data.uncompressedSize - a._data.uncompressedSize)[0];
    if (!txt) throw new Error("לא נמצא קובץ ‎.txt‎ בתוך ה-zip");
    return txt.async("string");
  }
  return file.text();
}
function focusExcerpt(chat, all, focus, budget){
  // הודעות של החברים שנבחרו, או שמזכירות אותם, עם שתי הודעות הקשר מכל צד
  const keys = focus.map(n => n.split(/\s+/)[0]).filter(k => k.length >= 2 && !/^[+\d]/.test(k));
  const keep = new Uint8Array(all.length);
  chat.msgs.forEach((m, i) => { if (focus.includes(m.n) || keys.some(k => m.x.includes(k))) for (let j = Math.max(0, i - 2); j <= Math.min(all.length - 1, i + 2); j++) keep[j] = 1; });
  const runs = []; let cur = null;
  for (let i = 0; i < all.length; i++){
    if (!keep[i]){ cur = null; continue; }
    if (!cur || cur.len > budget / 8) runs.push(cur = { i, lines: [], len: 0 });
    cur.lines.push(all[i]); cur.len += all[i].length + 1;
  }
  for (let k = runs.length - 1; k > 0; k--){ const r = Math.floor(Math.random() * (k + 1)); [runs[k], runs[r]] = [runs[r], runs[k]]; }
  let used = 0; const pick = [];
  for (const r of runs){ if (used + r.len > budget) continue; pick.push(r); used += r.len; }
  return pick.sort((a, b) => a.i - b.i).map(r => r.lines.join("\n")).join("\n…\n");
}
function chatDigest(chat, focus = []){
  const people = Object.entries(chat.stats).filter(([, s]) => s.msgs + s.media > 0).sort((a, b) => b[1].msgs - a[1].msgs);
  const statLines = people.map(([n, s]) => {
    const top = Object.entries(s.emoji).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]).join("");
    return `- ${n}: ${s.msgs} הודעות טקסט, ${s.media} קבצי מדיה, אורך הודעה ממוצע ${s.msgs ? Math.round(s.chars / s.msgs) : 0} תווים, ${s.night} הודעות בין חצות ל-5 בבוקר${top ? ", אימוג'ים מובילים: " + top : ""}`;
  }).join("\n");
  const max = CONFIG.ai.maxLineChars, budget = CONFIG.ai.chatCharBudget;
  const line = m => `[${m.d} ${m.t}] ${m.n}: ${m.x.length > max ? m.x.slice(0, max) + "…" : m.x}`.replace(/\n/g, " / ");
  const all = chat.msgs.map(line);
  const total = all.reduce((a, l) => a + l.length + 1, 0);
  let excerpt;
  if (total <= budget) excerpt = all.join("\n");
  else if (focus.length) excerpt = focusExcerpt(chat, all, focus, budget);
  else {
    // כמה חלונות רציפים ממקומות שונים בשיחה; המיקום אקראי, כך שכל יצירה מניבה שאלות אחרות
    const W = 8, per = budget / W, seg = Math.floor(all.length / W), parts = [];
    for (let w = 0; w < W; w++){
      let i = w * seg + Math.floor(Math.random() * seg * 0.8), used = 0; const buf = [];
      while (i < all.length && i < (w + 1) * seg && used + all[i].length < per){ buf.push(all[i]); used += all[i].length + 1; i++; }
      parts.push(buf.join("\n"));
    }
    excerpt = parts.join("\n\n--- קטע אחר מהשיחה ---\n\n");
  }
  return { statLines, excerpt, people: people.map(p => p[0]) };
}

async function httpJson(url, opts){
  let r; try { r = await fetch(url, opts); } catch { throw new Error("אין חיבור לשירות ה-AI. בדקו את הרשת ואת הכתובת."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && (j.error.message || j.error)) || ("שגיאה " + r.status));
  return j;
}
const aiHeaders = a => a.provider === "anthropic"
  ? { "x-api-key": a.key, "anthropic-version": "2023-06-01", "content-type": "application/json", "anthropic-dangerous-direct-browser-access": "true" }
  : a.provider === "compat" ? { authorization: "Bearer " + a.key, "content-type": "application/json" } : { "content-type": "application/json" };
async function loadModels(){
  const a = G.ai; if (!a.key) throw new Error("חסר מפתח API");
  let ids;
  if (a.provider === "gemini"){
    const j = await httpJson("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000&key=" + encodeURIComponent(a.key));
    ids = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace(/^models\//, "")).filter(id => /^gemini/.test(id));
    const good = ids.filter(id => /flash/.test(id) && !/lite|preview|exp|image|tts|live|audio|latest/.test(id)).sort().reverse();
    if (!ids.includes(a.model)) a.model = good[0] || ids[0] || "";
  } else if (a.provider === "anthropic"){
    const j = await httpJson("https://api.anthropic.com/v1/models?limit=100", { headers: aiHeaders(a) });
    ids = (j.data || []).map(m => m.id);
    if (!ids.includes(a.model)) a.model = ids.find(id => /sonnet/.test(id)) || ids[0] || "";
  } else {
    const j = await httpJson(a.base.replace(/\/$/, "") + "/models", { headers: aiHeaders(a) });
    ids = (j.data || []).map(m => m.id).sort();
    if (!ids.includes(a.model)) a.model = ids[0] || "";
  }
  a.models = ids; return ids;
}
async function aiCall(prompt){
  const a = G.ai;
  if (!a.key) throw new Error("חסר מפתח API לבינה המלאכותית");
  if (!a.model) await loadModels();
  if (!a.model) throw new Error("לא נמצא מודל זמין למפתח הזה");
  if (a.provider === "gemini"){
    const j = await httpJson(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(a.model)}:generateContent?key=${encodeURIComponent(a.key)}`,
      { method: "POST", headers: aiHeaders(a), body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: 1 } }) });
    return (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
  }
  if (a.provider === "anthropic"){
    const j = await httpJson("https://api.anthropic.com/v1/messages", { method: "POST", headers: aiHeaders(a), body: JSON.stringify({ model: a.model, max_tokens: 8000, messages: [{ role: "user", content: prompt }] }) });
    return (j.content || []).filter(c => c.type === "text").map(c => c.text).join("");
  }
  const j = await httpJson(a.base.replace(/\/$/, "") + "/chat/completions", { method: "POST", headers: aiHeaders(a), body: JSON.stringify({ model: a.model, messages: [{ role: "user", content: prompt }] }) });
  return j.choices?.[0]?.message?.content || "";
}
function cleanQuestions(text){
  const i = text.indexOf("{"), j = text.lastIndexOf("}");
  let data; try { data = JSON.parse(text.slice(i, j + 1)); } catch { throw new Error("התשובה מה-AI לא הגיעה בפורמט תקין. נסו שוב."); }
  const out = [];
  for (const q of data.questions || []){
    if (!q || typeof q.q !== "string" || !q.q.trim()) continue;
    const base = { id: rand(6), q: q.q.trim(), fun: String(q.fun || "").trim(), about: activeFocus() };
    if (q.type === "mc" && Array.isArray(q.options) && q.options.length >= 2 && Number.isInteger(q.answer) && q.options[q.answer] != null){
      const opts = q.options.slice(0, 6).map(o => ({ o: String(o), ok: false })); opts[q.answer].ok = true;
      for (let k = opts.length - 1; k > 0; k--){ const r = Math.floor(Math.random() * (k + 1)); [opts[k], opts[r]] = [opts[r], opts[k]]; }
      out.push({ ...base, type: "mc", options: opts.map(o => o.o), answer: opts.findIndex(o => o.ok) });
    } else if (q.type === "yn" && typeof q.answer === "boolean") out.push({ ...base, type: "yn", answer: q.answer });
    else if (q.type === "open" && q.answer != null && String(q.answer).trim()) out.push({ ...base, type: "open", answer: String(q.answer).trim(), accept: (Array.isArray(q.accept) ? q.accept : []).map(String) });
  }
  const allowed = G.settings.types;
  return out.filter(q => allowed[q.type]);
}

/* ============================ ניקוד ובדיקת תשובות ============================ */
function norm(s){
  return String(s ?? "").normalize("NFKC").toLowerCase().replace(/[֑-ׇ]/g, "").replace(/[^\p{L}\p{N}\s]/gu, " ")
    .replace(/\s+/g, " ").trim().replace(/ך/g, "כ").replace(/ם/g, "מ").replace(/ן/g, "נ").replace(/ף/g, "פ").replace(/ץ/g, "צ");
}
function lev(a, b){
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++){
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++){ const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return d[b.length];
}
function openOk(q, v){
  const n = norm(v); if (!n) return false;
  return [q.answer, ...(q.accept || [])].some(a => {
    a = norm(a); if (!a) return false;
    if (a === n) return true;
    if (lev(a, n) <= (a.length <= 3 ? 0 : a.length <= 6 ? 1 : 2)) return true;
    return a.length >= 3 && (" " + n + " ").includes(" " + a + " ");
  });
}
const isOk = (q, v) => q.type === "open" ? openOk(q, v) : v === q.answer;
const points = ms => Math.round(G.settings.base + G.settings.speedBonus * Math.max(0, 1 - ms / (G.qDur * 1000)));
const answerText = q => q.type === "mc" ? q.options[q.answer] : q.type === "yn" ? (q.answer ? "כן" : "לא") : q.answer;
const valueText = (q, v) => v == null ? "" : q.type === "mc" ? (q.options[v] ?? "") : q.type === "yn" ? (v ? "כן" : "לא") : String(v);

function hostOnMsg(m){
  if (!m || typeof m !== "object") return;

  const id = String(m.id || "").slice(0, 20); if (!id || G.kicked.includes(id)) return;

    if (G.players[id]){ if (G.players[id].nick === nick) return broadcast(); }
    const taken = n => Object.entries(G.players).some(([pid, p]) => pid !== id && p.nick === n);
    let n = nick, i = 2; while (taken(n)) n = nick + " " + i++;
    G.players[id] = { nick: n, score: G.players[id]?.score || 0, d: 0, joined: G.players[id]?.joined || Date.now() };
    return hostChanged();
  }
  if (m.k === "ans" && G.phase === "question" && m.qi === G.qi && G.players[id] && !(id in G.answers)){
    const ms = Date.now() - G.qStart; if (ms > G.qDur * 1000 + 1500) return;
    const q = G.questions[G.qi];
    const v = q.type === "mc" ? (Number.isInteger(m.v) && m.v >= 0 && m.v < q.options.length ? m.v : null) : q.type === "yn" ? (typeof m.v === "boolean" ? m.v : null) : String(m.v ?? "").trim().slice(0, 80) || null;
    if (v === null) return;
    G.answers[id] = { v, ms: Math.min(ms, G.qDur * 1000) };

async function generate(n, keep){
  if (!CHAT){ G.err = "קודם טוענים את קובץ השיחה."; return render(); }
  G.busy = "gen"; G.err = null; render();
  try {
    const kept = G.questions.slice(0, keep);
    const text = await aiCall(buildPrompt(n, kept));
    const qs = cleanQuestions(text);
    if (!qs.length) throw new Error("ה-AI לא החזיר שאלות שמישות. נסו שוב.");
    G.questions = G.questions.slice(0, keep).concat(qs); G.picker = false;
  } catch (e){ G.err = "יצירת השאלות נכשלה: " + (e.message || e); }
  G.busy = null; hostChanged();
}

/* ---------- מסכי המנהל ---------- */
function hostView(){
  const players = ranked(G.players);
  const head = topBar(`${["lobby", "question", "reveal"].includes(G.phase) ? `<button class="btn ghost" data-act="focus-open">על מי שואלים?</button>` : ""}<span class="pill">קוד: <b class="ltr">${G.code}</b></span><button class="btn ghost" data-act="reset">משחק חדש</button>`)
    + (G.picker && G.phase !== "setup" && G.phase !== "final" ? pickerHtml() : "");
  if (G.phase === "setup") return head + setupView(players);
  if (G.phase === "lobby") return head + lobbyView(players);
  const q = G.questions[G.qi];
  if (G.phase === "question"){
    return head + `<div class="row between"><h3>שאלה ${G.qi + 1} מתוך ${G.questions.length} · ${typeName(q.type)} ${aboutPill(q)}</h3><button class="btn" data-act="end-now">מסיימים עכשיו</button></div>
      ${bubble(CONFIG.botName, q.q)}${timerHtml()}
      ${q.type === "open" ? `<p class="dim">השחקנים מקלידים תשובה…</p>` : optsHtml(q, "show")}
      <div class="card"><div class="row between"><b>ענו ${Object.keys(G.answers).length} מתוך ${players.length}</b></div>
      <div class="chips">${players.map(p => `<span class="chip ${p.id in G.answers ? "done" : ""}">${esc(p.nick)}${p.id in G.answers ? " ✓" : ""}</span>`).join("")}</div></div>`;
  }
  if (G.phase === "reveal"){
    const last = G.qi >= G.questions.length - 1;
    let body;
    if (q.type === "open"){
      const cards = players.map(p => ({ p, a: G.answers[p.id] })).sort((x, y) => (x.a ? x.a.ms : 1e9) - (y.a ? y.a.ms : 1e9)).map(({ p, a }) => a
        ? `<div class="ans ${a.ok ? "ok" : ""}"><span class="nick">${esc(p.nick)} · ${(a.ms / 1000).toFixed(1)} שנ׳</span><span class="txt">${esc(a.v)}</span>
           <div class="row between"><b>${a.ok ? "+" + fmt(a.pts) : "0"}</b><button class="btn ghost" data-act="toggle-ok" data-id="${p.id}">${a.ok ? "לסמן כשגויה" : "לסמן כנכונה"}</button></div></div>`
        : `<div class="ans none"><span class="nick">${esc(p.nick)}</span><span class="txt">לא ענה/תה</span></div>`).join("");
      body = `<div class="card"><div class="row between"><h3>מה כולם כתבו</h3>
        <label class="chk"><input type="checkbox" id="shareBox" data-act-change="share" ${G.share ? "checked" : ""}> להציג את התשובות גם במסכים של השחקנים</label></div>
        <div class="answers">${cards}</div><p class="small dim">הבדיקה האוטומטית סלחנית לשגיאות כתיב. אפשר לתקן ידנית, והניקוד מתעדכן מיד.</p></div>`;
    } else {
      const list = q.type === "yn" ? [true, false] : q.options.map((_, i) => i);
      const counts = list.map(v => players.filter(p => G.answers[p.id]?.v === v).map(p => p.nick).join(", "));
      body = optsHtml(q, "show", { right: q.answer, counts });
    }
    return head + `<div class="row between"><h3>שאלה ${G.qi + 1} מתוך ${G.questions.length} · התשובה</h3><button class="btn hot big" data-act="next" ${G.busy ? "disabled" : ""}>${last ? "לטקס הסיום" : "לשאלה הבאה"}</button></div>
      ${bubble(q.q, answerText(q))}${q.fun ? `<div class="fun">${esc(q.fun)}</div>` : ""}${body}
      <div class="card"><h3>טבלת הניקוד</h3>${lbHtml(players)}</div>`;
  }
  // final
  return head + `<h2>וזהו. יש לנו מנצחים</h2>${podiumHtml(players)}<div class="card"><h3>הטבלה המלאה</h3>${lbHtml(players)}</div>
    <div class="row"><button class="btn go big" data-act="again">סיבוב נוסף עם שאלות חדשות</button></div>`;
}
function podiumHtml(players){
  const [a, b, c] = players; const cell = (p, n) => p ? `<div class="p${n}"><b>${n}</b>${esc(p.nick)}<br><span class="dim">${fmt(p.score)}</span></div>` : "";
  return `<div class="podium">${cell(b, 2)}${cell(a, 1)}${cell(c, 3)}</div>`;
}

function qEditHtml(q, i){

  else if (q.type === "yn") ans = `<div class="row"><label class="chk"><input type="radio" name="r_${q.id}" id="q_${q.id}_y" data-qset="${i}.answer.true" ${q.answer ? "checked" : ""}> כן</label><label class="chk"><input type="radio" name="r_${q.id}" id="q_${q.id}_n" data-qset="${i}.answer.false" ${q.answer ? "" : "checked"}> לא</label></div>`;
  else ans = `<div class="row"><label class="f">תשובה<input type="text" id="q_${q.id}_a" data-qbind="${i}.answer" value="${esc(q.answer)}"></label><label class="f">מתקבל גם (מופרד בפסיקים)<input type="text" id="q_${q.id}_ac" data-qbind="${i}.accept" value="${esc((q.accept || []).join(", "))}"></label></div>`;
  return `<div class="qedit"><div class="row between"><span class="row"><span class="pill">${i + 1} · ${typeName(q.type)}</span>${aboutPill(q)}</span><button class="btn ghost" data-act="del-q" data-i="${i}">מחיקה</button></div>
    <textarea id="q_${q.id}_q" data-qbind="${i}.q">${esc(q.q)}</textarea>${ans}

}

/* ---------- מסכי השחקן ---------- */
function playerView(){
  const s = P.S, head = topBar(P.nick ? `<span class="pill">${esc(P.nick)}</span>` : "");
  if (!P.nick){
    return head + `<div class="col" style="gap:4px;padding-top:3vh"><h1 style="font-size:clamp(52px,15vw,84px)">${esc(CONFIG.title)}</h1></div>
      <div class="card">${P.kicked ? `<div class="err">מנהל המשחק הסיר אותך. אפשר להצטרף שוב בכינוי אחר.</div>` : ""}<h3>איך קוראים לך?</h3>
      <form class="col" data-form="nick"><input type="text" id="nickIn" maxlength="${CONFIG.maxNick}" placeholder="כינוי שכולם יזהו" autocomplete="off" style="font-size:22px">
      <button class="btn hot big" ${NET_ON ? "" : "disabled"}>נכנסים למשחק</button></form>
      <p class="small dim">${s ? `כבר בפנים: ${s.players.map(p => esc(p.nick)).join(", ") || "אף אחד, תהיו הראשונים"}` : "מחפשים את המשחק…"}</p></div>`;
  }
  if (!s) return head + `<div class="card"><div class="row"><span class="spin"></span><b>מתחברים למשחק…</b></div><p class="small dim">אם זה נמשך, ודאו שמנהל המשחק פתח את המסך שלו.</p></div>`;
  const me = s.players.find(p => p.id === P.id), rank = s.players.findIndex(p => p.id === P.id) + 1;
  const stale = Date.now() - P.lastSeen > 13000 ? `<div class="note">החיבור למנהל המשחק נקטע. מחכים שיחזור…</div>` : "";
  if (s.phase === "lobby"){
    return head + stale + `<h2>${esc(P.nick)}, אתם בפנים</h2><div class="card"><div class="row"><span class="spin"></span><b>${s.ready ? "מחכים שמנהל המשחק ילחץ על התחלה…" : "מנהל המשחק מכין את השאלות…"}</b></div>
      <div class="chips">${s.players.map(p => `<span class="chip ${p.id === P.id ? "me" : ""}">${esc(p.nick)}</span>`).join("")}</div></div>
      <div class="card"><h3>איך משחקים</h3><p>עונים מהר ונכון. תשובה נכונה שווה נקודות, ותשובה מהירה שווה יותר.</p></div>`;
  }
  const q = s.q;
  if (s.phase === "question" && q){
    const mine = P.my?.qi === s.qi ? P.my : null, got = s.answered.includes(P.id);
    let body;
    if (mine) body = `<div class="card"><h3>${got ? "נקלט!" : "שולחים…"}</h3><p>התשובה שלך: <b>${esc(valueText(q, mine.v))}</b></p><p class="dim">ענו ${s.answered.length} מתוך ${s.players.length}. מחכים לכולם…</p></div>`;
    else if (q.type === "open") body = `<form class="col" data-form="open"><input type="text" id="openIn" maxlength="80" placeholder="התשובה שלך" autocomplete="off" style="font-size:24px;padding:14px"><button class="btn hot big">שליחה</button></form>`;
    else body = optsHtml(q, "play");
    return head + stale + `<div class="row between"><b>שאלה ${s.qi + 1} מתוך ${s.n}</b>${aboutPill(q)}<span class="pill">${fmt(me?.score)} נק׳</span></div>${timerHtml()}${bubble(CONFIG.botName, q.q)}${body}`;
  }
  if (s.phase === "reveal" && q && s.reveal){
    const r = s.reveal.res[P.id];
    const verdict = !r ? `<div class="verdict no">לא ענית בזמן</div>` : r[0] ? `<div class="verdict ok">צדקת! +${fmt(r[1])}</div>` : `<div class="verdict no">לא הפעם</div>`;
    return head + stale + `<div class="pop">${verdict}</div>${bubble(q.q, s.reveal.text)}
      ${r && !r[0] ? `<p>התשובה שלך: <b>${esc(valueText(q, r[2]))}</b></p>` : ""}
      ${s.reveal.fun ? `<div class="fun">${esc(s.reveal.fun)}</div>` : ""}
      ${s.reveal.shared ? `<div class="card"><h3>מה כולם כתבו</h3><div class="answers">${s.reveal.shared.map(a => `<div class="ans ${a.ok ? "ok" : ""}"><span class="nick">${esc(a.n)}</span><span class="txt">${esc(a.v)}</span></div>`).join("")}</div></div>` : ""}
      <div class="card"><div class="row between"><h3>מקום ${rank || "-"}</h3><span class="pill">${fmt(me?.score)} נק׳</span></div>${lbHtml(s.players, P.id, 5)}</div>`;
  }
  if (s.phase === "final"){
    const line = rank === 1 ? "ניצחת! מכיר/ה את החברים הכי טוב" : rank <= 3 ? "על הפודיום. כבוד" : "יש מקום לשיפור. תקראו יותר את הקבוצה";
    return head + `<h2>מקום ${rank || "-"}</h2><p style="font-size:22px;font-weight:600">${line}</p>${podiumHtml(s.players)}<div class="card"><h3>הטבלה המלאה</h3>${lbHtml(s.players, P.id)}</div>`;
  }
  return head + `<div class="card"><div class="row"><span class="spin"></span><b>רגע…</b></div></div>`;
}

/* ============================ רינדור ============================ */
function render(){
  const keep = {}; const act = document.activeElement;
  for (const el of app.querySelectorAll("input[id]:not([type=file]):not([type=checkbox]):not([type=radio]),textarea[id]")) keep[el.id] = el.value;
  const focus = act && act.id && app.contains(act) ? { id: act.id, a: act.selectionStart, b: act.selectionEnd } : null;
  const y = window.scrollY;
  app.className = MODE === "host" ? "" : "narrow";
  app.innerHTML = MODE === "host" ? hostView() : MODE === "player" ? playerView() : homeView();
  for (const [id, v] of Object.entries(keep)){ const el = document.getElementById(id); if (el && !el.dataset.bind && !el.dataset.qbind) el.value = v; }
  if (focus){ const el = document.getElementById(focus.id); if (el){ el.focus({ preventScroll: true }); try { el.setSelectionRange(focus.a, focus.b); } catch {} } }
  window.scrollTo(0, y); tick();
}
function tick(){
  const t = app.querySelector("[data-timer]"); if (!t) return;
  const dur = (MODE === "host" ? G.qDur : P.S.q.dur) * 1000, ms = Math.max(0, Math.min(dur, remaining()));
  t.firstElementChild.style.width = (ms / dur * 100) + "%"; t.lastElementChild.textContent = Math.ceil(ms / 1000);
  t.classList.toggle("low", ms < 6000);
}
setInterval(tick, 200);
setInterval(() => {
  if (MODE === "host" && NET){ broadcast(); if (G.busy === "gen"){ loadLine++; const el = document.getElementById("loadLine"); if (el) el.textContent = CONFIG.loadingLines[loadLine % CONFIG.loadingLines.length]; } }
  if (MODE === "player" && P){
    const s = P.S;
    if (!s) NET?.send("up", P.nick ? { k: "join", id: P.id, nick: P.nick } : { k: "hello" });
    else if (s.phase === "question" && P.my?.qi === s.qi && !s.answered.includes(P.id)) NET.send("up", { k: "ans", id: P.id, qi: s.qi, v: P.my.v });
    if (s && Date.now() - P.lastSeen > 13000) render();
  }
}, 3500);

/* ============================ אירועים ============================ */
function setPath(obj, path, val){ const ks = path.split("."); const last = ks.pop(); for (const k of ks) obj = obj[k]; obj[last] = val; }
app.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind && MODE === "host"){
    const v = el.type === "checkbox" ? el.checked : el.type === "number" ? Number(el.value) : el.value;
    setPath(G, el.dataset.bind, v);
    if (el.dataset.bind === "ai.provider"){ G.ai.model = ""; G.ai.models = []; G.aiMsg = ""; }
    if (el.dataset.bind === "ai.key" || el.dataset.bind === "ai.base"){ G.ai.models = []; }
    saveHost(); if (el.dataset.rerender !== undefined) render();
  }
  if (el.dataset.qbind && MODE === "host"){
    const [i, ...rest] = el.dataset.qbind.split("."); const q = G.questions[i]; if (!q) return;
    if (rest[0] === "accept") q.accept = el.value.split(",").map(s => s.trim()).filter(Boolean); else setPath(q, rest.join("."), el.value);
    saveHost();
  }
});
app.addEventListener("change", async e => {
  const el = e.target;
  if (el.dataset.qset && MODE === "host"){ const [i, , v] = el.dataset.qset.split("."); const q = G.questions[i]; if (q){ q.answer = q.type === "yn" ? v === "true" : Number(v); saveHost(); } }
  if (el.dataset.focus !== undefined && MODE === "host"){
    const set = new Set(activeFocus()); el.checked ? set.add(el.dataset.focus) : set.delete(el.dataset.focus);
    G.focus = [...set]; saveHost(); return render();
  }
  if (el.dataset.actChange === "share"){ G.share = el.checked; hostChanged(); }
  if (el.id === "chatFile" && el.files[0]){
    try {
      const chat = parseChat(await readChatFile(el.files[0]));
      if (chat.msgs.length < 20) throw new Error("לא הצלחנו לזהות הודעות בקובץ. ודאו שזה ייצוא צ׳אט של וואטסאפ (קובץ ‎.txt‎ או ‎.zip‎).");
      CHAT = chat; G.chatInfo = { members: Object.entries(chat.stats).filter(([, s]) => s.msgs).sort((a, b) => b[1].msgs - a[1].msgs).map(([n, s]) => [n, s.msgs]), msgs: chat.msgs.length, people: Object.values(chat.stats).filter(s => s.msgs).length, from: chat.from, to: chat.to }; G.err = null;
    } catch (err){ CHAT = null; G.err = err.message; }
    saveHost(); render();
  }
});
app.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target.dataset.form;
  if (f === "code"){ const c = document.getElementById("codeIn").value.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (c){ location.hash = c; location.reload(); } }
  if (f === "nick") playerJoin(document.getElementById("nickIn").value);
  if (f === "open"){ const v = document.getElementById("openIn").value.trim(); if (v) playerAnswer(v); }
});
app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "host-new") return startHost(newGame(LS.get("mhs_host") ? { ai: LS.get("mhs_host").ai, settings: LS.get("mhs_host").settings } : null));
  if (act === "host-resume") return startHost(LS.get("mhs_host"));
  if (act === "answer"){ const q = P.S.q, i = Number(b.dataset.v); return playerAnswer(q.type === "yn" ? i === 0 : i); }
  if (MODE !== "host") return;
  switch (act){
    case "reset": if (b.dataset.sure){ NET?.close(); NET = null; return startHost(newGame({ ai: G.ai, settings: G.settings, chatInfo: CHAT ? G.chatInfo : null })); } b.dataset.sure = 1; b.textContent = "בטוח? לחיצה נוספת מאפסת"; return;
    case "test-ai": G.busy = "test"; G.aiMsg = "בודקים…"; render();
      try { const ids = await loadModels(); G.aiMsg = `החיבור תקין. ${ids.length} מודלים זמינים, נבחר ${G.ai.model}.`; } catch (err){ G.aiMsg = "החיבור נכשל: " + err.message; }
      G.busy = null; saveHost(); return render();
    case "gen": return generate(Math.max(1, Math.min(40, Number(G.settings.numQuestions) || 10)), 0);
    case "gen-more": return generate(5, G.questions.length);
    case "focus-open": G.picker = !G.picker; G.err = null; return render();
    case "focus-all": G.focus = []; saveHost(); return render();
    case "focus-apply": { const n = Math.max(1, Math.min(40, Number(document.getElementById("pickN")?.value) || 5)); return generate(n, G.phase === "lobby" ? 0 : G.qi + 1); }
    case "toggle-qs": G.showQs = !G.showQs; return render();
    case "del-q": G.questions.splice(Number(b.dataset.i), 1); return hostChanged();
    case "open-lobby": G.phase = "lobby"; G.showQs = false; return hostChanged();
    case "back-setup": G.phase = "setup"; return hostChanged();
    case "kick": delete G.players[b.dataset.id]; G.kicked.push(b.dataset.id); return hostChanged();
    case "start": for (const p of Object.values(G.players)){ p.score = 0; p.d = 0; } return startQuestion(0);
    case "end-now": return endQuestion();
    case "toggle-ok": return toggleOk(b.dataset.id);
    case "next": if (G.busy) return; return G.qi >= G.questions.length - 1 ? finish() : startQuestion(G.qi + 1);
    case "again": { const g = newGame(G); g.code = G.code; g.kicked = G.kicked; G = g; return hostChanged(); }
    case "copy-link": try { await navigator.clipboard.writeText(joinUrl(G.code)); b.textContent = "הועתק ✓"; } catch { b.textContent = "סמנו והעתיקו ידנית"; } return;
  }
});

/* ============================ אתחול ============================ */
async function startHost(game){
  MODE = "host"; G = game; G.busy = null; NET_ON = false; render(); saveHost();
  try { NET = await openNet(G.code, "up", hostOnMsg, on => { NET_ON = on; if (on) broadcast(); render(); }); armTimer(); }
  catch (e){ G.err = e.message; render(); }
}
async function startPlayer(code){
  MODE = "player"; const saved = LS.get("mhs_p_" + code) || {};
  P = { code, id: saved.id || rand(12), nick: saved.nick || "", S: null, offset: null, lastSeen: Date.now(), my: null };
  render();
  try { NET = await openNet(code, "state", playerOnMsg, on => { NET_ON = on; if (on) NET.send("up", P.nick ? { k: "join", id: P.id, nick: P.nick } : { k: "hello" }); render(); }); }
  catch (e){ app.insertAdjacentHTML("beforeend", `<div class="err">${esc(e.message)}</div>`); }
}
window.addEventListener("hashchange", () => location.reload());
document.title = CONFIG.title;
const code0 = location.hash.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
if (code0) startPlayer(code0); else render();
</script>
